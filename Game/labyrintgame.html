<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Multiplayer Labyrinth Maker & Race</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; text-align: center; }
        canvas { background: #000; border: 2px solid #555; display: block; margin: 10px auto; cursor: crosshair; }
        .controls, .editor-tools { margin: 10px 0; }
        input, button { padding: 8px 12px; margin: 4px; font-weight: bold; border-radius: 4px; border: none; }
        button { cursor: pointer; background: #333; color: white; border: 1px solid #666; }
        button.active { background: #4CAF50; color: white; border-color: #4CAF50; }
        #status { font-weight: bold; color: #ffeb3b; font-size: 1.2em; margin: 10px 0; }
        .highlight { color: #2196F3; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Labyrinth Race (50x50)</h1>
    <div id="status">Gib deinen Spielernamen ein, um zu starten!</div>

    <div class="controls" id="name-setup">
        <input type="text" id="my-name-input" placeholder="Dein Spielername">
        <button onclick="registerName()" style="background: #4CAF50; color: white;">Name bestätigen</button>
    </div>

    <div class="controls" id="connection-box" style="display: none;">
        <p>Dein Name im Spiel: <span class="highlight" id="display-my-name"></span></p>
        <hr style="width: 300px; border-color: #444;">
        <input type="text" id="join-name-input" placeholder="Name des Gegners eingeben">
        <button onclick="connectToPeer()" style="background: #2196F3; color: white;">Verbinden</button>
    </div>

    <div class="editor-tools" id="editor-tools" style="display: none;">
        <button id="btn-wall" class="active" onclick="setTool('wall')">Wand zeichnen/löschen</button>
        <button id="btn-start" onclick="setTool('start')">Startpunkt setzen</button>
        <button id="btn-end" onclick="setTool('end')">Zielpunkt setzen</button>
        <button style="background: #4CAF50; color: white;" onclick="sendMaze()">Labyrinth fertiggestellt!</button>
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <script>
        const GRID_SIZE = 50;
        const CELL_SIZE = 10;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'name_setup'; 
        let currentTool = 'wall';
        let peer = null;
        let conn = null;

        let myName = "";
        let enemyName = "";

        // Labyrinth-Daten
        let myMaze = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
        let myStart = { x: 0, y: 0 };
        let myEnd = { x: 49, y: 49 };

        let playMaze = null;
        let playStart = { x: 0, y: 0 };
        let playEnd = { x: 49, y: 49 };
        
        let playerPos = { x: 0, y: 0 };
        let enemyPos = { x: 0, y: 0 };

        // 1. Namen registrieren und als Peer-ID nutzen
        function registerName() {
            const input = document.getElementById('my-name-input').value.trim();
            if (!input) return alert("Bitte gib einen Spielernamen ein!");

            myName = input;

            // Name direkt als Peer ID nutzen
            peer = new Peer(myName);

            peer.on('open', (id) => {
                document.getElementById('name-setup').style.display = 'none';
                document.getElementById('connection-box').style.display = 'block';
                document.getElementById('display-my-name').innerText = myName;
                document.getElementById('status').innerText = 'Verbinde dich jetzt mit deinem Gegner!';
                gameState = 'connect';
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert('Dieser Name ist gerade schon vergeben! Bitte wähle einen anderen Namen.');
                } else {
                    alert('Fehler bei der Verbindung: ' + err.type);
                }
            });

            // Wenn sich ein anderer Spieler mit unserem Namen verbindet
            peer.on('connection', (c) => {
                conn = c;
                enemyName = c.peer; // Der Name des Gegners entspricht seiner ID
                setupConnection();
            });
        }

        // 2. Mit dem Namen des Gegners verbinden
        function connectToPeer() {
            enemyName = document.getElementById('join-name-input').value.trim();
            if (!enemyName) return alert("Bitte gib den Namen des Gegners ein!");
            
            if (enemyName === myName) {
                return alert("Du kannst dich nicht mit dir selbst verbinden!");
            }

            conn = peer.connect(enemyName);
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                startEditingPhase();
            });

            conn.on('data', (data) => {
                if (data.type === 'maze_data') {
                    playMaze = data.maze;
                    playStart = data.start;
                    playEnd = data.end;
                    playerPos = { ...playStart };
                    checkStartGame();
                } else if (data.type === 'player_move') {
                    enemyPos = data.pos;
                    draw();
                } else if (data.type === 'win') {
                    gameState = 'gameover';
                    document.getElementById('status').innerText = `❌ ${enemyName} war schneller! Du hast verloren.`;
                    draw();
                }
            });
        }

        function startEditingPhase() {
            document.getElementById('connection-box').style.display = 'none';
            document.getElementById('editor-tools').style.display = 'block';
            document.getElementById('status').innerText = `Du baust ein Labyrinth für ${enemyName}!`;
            gameState = 'edit';
            draw();
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.editor-tools button').forEach(b => b.classList.remove('active'));
            if(tool === 'wall') document.getElementById('btn-wall').classList.add('active');
            if(tool === 'start') document.getElementById('btn-start').classList.add('active');
            if(tool === 'end') document.getElementById('btn-end').classList.add('active');
        }

        // Editor Steuerung
        let isMouseDown = false;
        canvas.addEventListener('mousedown', (e) => { isMouseDown = true; handleCanvasClick(e); });
        canvas.addEventListener('mouseup', () => isMouseDown = false);
        canvas.addEventListener('mousemove', (e) => { if(isMouseDown && currentTool === 'wall') handleCanvasClick(e); });

        function handleCanvasClick(e) {
            if (gameState !== 'edit') return;
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / CELL_SIZE);
            const y = Math.floor((e.clientY - rect.top) / CELL_SIZE);

            if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
                if (currentTool === 'wall') {
                    myMaze[y][x] = myMaze[y][x] === 1 ? 0 : 1;
                } else if (currentTool === 'start') {
                    myStart = { x, y };
                    myMaze[y][x] = 0;
                } else if (currentTool === 'end') {
                    myEnd = { x, y };
                    myMaze[y][x] = 0;
                }
                draw();
            }
        }

        function sendMaze() {
            gameState = 'waiting';
            document.getElementById('editor-tools').style.display = 'none';
            document.getElementById('status').innerText = `Warte auf das Labyrinth von ${enemyName}...`;
            
            conn.send({
                type: 'maze_data',
                maze: myMaze,
                start: myStart,
                end: myEnd
            });

            checkStartGame();
        }

        function checkStartGame() {
            if (gameState === 'waiting' && playMaze !== null) {
                gameState = 'play';
                document.getElementById('status').innerText = `🚀 LOS! Schlag ${enemyName} und erreiche das Ziel!`;
                draw();
            }
        }

        // Bewegung im Labyrinth
        window.addEventListener('keydown', (e) => {
            if (gameState !== 'play') return;

            let newX = playerPos.x;
            let newY = playerPos.y;

            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') newY--;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') newY++;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') newX--;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') newX++;

            if (newX >= 0 && newX < GRID_SIZE && newY >= 0 && newY < GRID_SIZE) {
                if (playMaze[newY][newX] !== 1) {
                    playerPos.x = newX;
                    playerPos.y = newY;

                    conn.send({ type: 'player_move', pos: playerPos });

                    if (playerPos.x === playEnd.x && playerPos.y === playEnd.y) {
                        gameState = 'gameover';
                        document.getElementById('status').innerText = `🏆 GEWONNEN! ${myName} hat das Ziel zuerst erreicht!`;
                        conn.send({ type: 'win' });
                    }

                    draw();
                }
            }
        });

        // Grafik zeichnen
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'edit' || gameState === 'waiting') {
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (myMaze[r][c] === 1) {
                            ctx.fillStyle = '#888';
                            ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                        }
                    }
                }
                ctx.fillStyle = '#00FF00';
                ctx.fillRect(myStart.x * CELL_SIZE, myStart.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#FF0000';
                ctx.fillRect(myEnd.x * CELL_SIZE, myEnd.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

            } else if (gameState === 'play' || gameState === 'gameover') {
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (playMaze[r][c] === 1) {
                            ctx.fillStyle = '#444';
                            ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                        }
                    }
                }
                // Ziel
                ctx.fillStyle = '#00FF00';
                ctx.fillRect(playEnd.x * CELL_SIZE, playEnd.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

                // Gegner (Rot)
                ctx.fillStyle = 'rgba(255, 0, 0, 0.6)';
                ctx.fillRect(enemyPos.x * CELL_SIZE, enemyPos.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

                // Spieler (Blau)
                ctx.fillStyle = '#00BFFF';
                ctx.fillRect(playerPos.x * CELL_SIZE, playerPos.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }
        }

        draw();
    </script>
</body>
</html>
