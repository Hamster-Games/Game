<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplayer Labyrinth Race</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { 
            box-sizing: border-box; 
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        body { 
            margin: 0; 
            padding: 10px; 
            background: #121212; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
        }

        #canvas-container {
            width: 100%;
            max-width: 500px;
            margin: 10px auto;
            touch-action: none; /* Verhindert Scrollen beim Wischen über das Spielfeld */
        }

        canvas { 
            background: #000; 
            border: 2px solid #444; 
            display: block; 
            width: 100%; 
            height: auto; 
            border-radius: 6px;
        }

        .controls, .editor-tools { 
            margin: 10px auto; 
            max-width: 500px;
        }

        input {
            padding: 12px;
            margin: 4px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: white;
            text-align: center;
        }

        button { 
            padding: 12px 16px; 
            margin: 4px; 
            font-weight: bold; 
            border-radius: 8px; 
            border: none; 
            font-size: 14px;
            cursor: pointer; 
            background: #2a2a2a; 
            color: white; 
            border: 1px solid #444; 
        }

        button:active { transform: scale(0.96); }
        button.active { background: #4CAF50; color: white; border-color: #4CAF50; }
        
        #status { 
            font-weight: bold; 
            color: #ffeb3b; 
            font-size: 1.1em; 
            margin: 10px 0; 
            min-height: 1.5em; 
        }

        /* Virtuelles D-Pad für Smartphones */
        #dpad {
            display: none;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 6px;
            justify-content: center;
            margin: 15px auto;
        }

        #dpad button {
            background: #333;
            color: white;
            font-size: 22px;
            padding: 0;
            margin: 0;
            border: 1px solid #555;
            border-radius: 10px;
        }

        #dpad button:active { background: #2196F3; }
    </style>
</head>
<body>

    <h2>Labyrinth Race (50x50)</h2>
    <div id="status">Name eingeben & starten!</div>

    <div class="controls" id="name-setup">
        <input type="text" id="my-name-input" placeholder="Dein Spielername">
        <br>
        <button onclick="registerName()" style="background: #4CAF50; color: white; width: 80%; margin-top: 8px;">Name bestätigen</button>
    </div>

    <div class="controls" id="connection-box" style="display: none;">
        <p>Dein Name: <b style="color: #2196F3;" id="display-my-name"></b></p>
        <input type="text" id="join-name-input" placeholder="Name des Gegners">
        <br>
        <button onclick="connectToPeer()" style="background: #2196F3; color: white; width: 80%; margin-top: 8px;">Mit Gegner verbinden</button>
    </div>

    <div class="editor-tools" id="editor-tools" style="display: none;">
        <button id="btn-wall" class="active" onclick="setTool('wall')">🧱 Wand</button>
        <button id="btn-erase" onclick="setTool('erase')">🧹 Löschen</button>
        <button id="btn-start" onclick="setTool('start')">🟢 Start</button>
        <button id="btn-end" onclick="setTool('end')">🔴 Ziel</button>
        <br>
        <button style="background: #4CAF50; color: white; width: 90%; margin-top: 10px;" onclick="sendMaze()"> Fertig! Labyrinth abschicken</button>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
    </div>

    <div id="dpad">
        <div></div>
        <button onclick="movePlayer(0, -1)">▲</button>
        <div></div>
        <button onclick="movePlayer(-1, 0)">◄</button>
        <div></div>
        <button onclick="movePlayer(1, 0)">►</button>
        <div></div>
        <button onclick="movePlayer(0, 1)">▼</button>
        <div></div>
    </div>

    <script>
        const GRID_SIZE = 50;
        const CELL_SIZE = 10;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'name_setup'; 
        let currentTool = 'wall';
        let peer = null;
        let conn = null;

        let myName = "";
        let enemyName = "";

        let myMaze = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
        let myStart = { x: 0, y: 0 };
        let myEnd = { x: 49, y: 49 };

        let playMaze = null;
        let playStart = { x: 0, y: 0 };
        let playEnd = { x: 49, y: 49 };
        
        let playerPos = { x: 0, y: 0 };
        let enemyPos = { x: 0, y: 0 };

        function registerName() {
            const input = document.getElementById('my-name-input').value.trim();
            if (!input) return alert("Bitte gib einen Namen ein!");

            myName = input;
            peer = new Peer(myName);

            peer.on('open', () => {
                document.getElementById('name-setup').style.display = 'none';
                document.getElementById('connection-box').style.display = 'block';
                document.getElementById('display-my-name').innerText = myName;
                document.getElementById('status').innerText = 'Verbinde dich mit deinem Gegner!';
                gameState = 'connect';
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert('Dieser Name ist schon besetzt! Nimm einen anderen.');
                } else {
                    alert('Verbindungsfehler: ' + err.type);
                }
            });

            peer.on('connection', (c) => {
                conn = c;
                enemyName = c.peer;
                setupConnection();
            });
        }

        function connectToPeer() {
            enemyName = document.getElementById('join-name-input').value.trim();
            if (!enemyName) return alert("Bitte Gegner-Namen eingeben!");
            if (enemyName === myName) return alert("Du kannst dich nicht selbst herausfordern!");

            conn = peer.connect(enemyName);
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                startEditingPhase();
            });

            conn.on('data', (data) => {
                if (data.type === 'maze_data') {
                    playMaze = data.maze;
                    playStart = data.start;
                    playEnd = data.end;
                    playerPos = { ...playStart };
                    checkStartGame();
                } else if (data.type === 'player_move') {
                    enemyPos = data.pos;
                    draw();
                } else if (data.type === 'win') {
                    gameState = 'gameover';
                    document.getElementById('status').innerText = `❌ ${enemyName} hat das Ziel vor dir erreicht!`;
                    document.getElementById('dpad').style.display = 'none';
                    draw();
                }
            });
        }

        function startEditingPhase() {
            document.getElementById('connection-box').style.display = 'none';
            document.getElementById('editor-tools').style.display = 'block';
            document.getElementById('status').innerText = `Baue ein Labyrinth für ${enemyName}!`;
            gameState = 'edit';
            draw();
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.editor-tools button').forEach(b => b.classList.remove('active'));
            if(tool === 'wall') document.getElementById('btn-wall').classList.add('active');
            if(tool === 'erase') document.getElementById('btn-erase').classList.add('active');
            if(tool === 'start') document.getElementById('btn-start').classList.add('active');
            if(tool === 'end') document.getElementById('btn-end').classList.add('active');
        }

        // Touch & Pointer Koordinaten-Umrechnung
        function getGridPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = Math.floor(((clientX - rect.left) * scaleX) / CELL_SIZE);
            const y = Math.floor(((clientY - rect.top) * scaleY) / CELL_SIZE);

            return { x, y };
        }

        let isDrawing = false;

        function handlePointerStart(e) {
            if (gameState !== 'edit') return;
            isDrawing = true;
            handlePointerMove(e);
        }

        function handlePointerMove(e) {
            if (gameState !== 'edit' || !isDrawing) return;
            const pos = getGridPos(e);

            if (pos.x >= 0 && pos.x < GRID_SIZE && pos.y >= 0 && pos.y < GRID_SIZE) {
                if (currentTool === 'wall') {
                    myMaze[pos.y][pos.x] = 1;
                } else if (currentTool === 'erase') {
                    myMaze[pos.y][pos.x] = 0;
                } else if (currentTool === 'start') {
                    myStart = { x: pos.x, y: pos.y };
                    myMaze[pos.y][pos.x] = 0;
                } else if (currentTool === 'end') {
                    myEnd = { x: pos.x, y: pos.y };
                    myMaze[pos.y][pos.x] = 0;
                }
                draw();
            }
        }

        function handlePointerEnd() { isDrawing = false; }

        canvas.addEventListener('mousedown', handlePointerStart);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerEnd);

        canvas.addEventListener('touchstart', (e) => { handlePointerStart(e); e.preventDefault(); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { handlePointerMove(e); e.preventDefault(); }, { passive: false });
        canvas.addEventListener('touchend', handlePointerEnd);

        function sendMaze() {
            gameState = 'waiting';
            document.getElementById('editor-tools').style.display = 'none';
            document.getElementById('status').innerText = `Warte auf ${enemyName}...`;
            
            conn.send({
                type: 'maze_data',
                maze: myMaze,
                start: myStart,
                end: myEnd
            });

            checkStartGame();
        }

        function checkStartGame() {
            if (gameState === 'waiting' && playMaze !== null) {
                gameState = 'play';
                document.getElementById('status').innerText = `🚀 RENNEN! Schlag ${enemyName}!`;
                document.getElementById('dpad').style.display = 'grid';
                draw();
            }
        }

        function movePlayer(dx, dy) {
            if (gameState !== 'play') return;

            let newX = playerPos.x + dx;
            let newY = playerPos.y + dy;

            if (newX >= 0 && newX < GRID_SIZE && newY >= 0 && newY < GRID_SIZE) {
                if (playMaze[newY][newX] !== 1) {
                    playerPos.x = newX;
                    playerPos.y = newY;

                    conn.send({ type: 'player_move', pos: playerPos });

                    if (playerPos.x === playEnd.x && playerPos.y === playEnd.y) {
                        gameState = 'gameover';
                        document.getElementById('status').innerText = `🏆 GEWONNEN! Du warst schneller!`;
                        document.getElementById('dpad').style.display = 'none';
                        conn.send({ type: 'win' });
                    }

                    draw();
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') movePlayer(0, -1);
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') movePlayer(0, 1);
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') movePlayer(-1, 0);
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') movePlayer(1, 0);
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'edit' || gameState === 'waiting') {
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (myMaze[r][c] === 1) {
                            ctx.fillStyle = '#888';
                            ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                        }
                    }
                }
                ctx.fillStyle = '#00FF00';
                ctx.fillRect(myStart.x * CELL_SIZE, myStart.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#FF0000';
                ctx.fillRect(myEnd.x * CELL_SIZE, myEnd.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

            } else if (gameState === 'play' || gameState === 'gameover') {
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (playMaze[r][c] === 1) {
                            ctx.fillStyle = '#444';
                            ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                        }
                    }
                }
                ctx.fillStyle = '#00FF00';
                ctx.fillRect(playEnd.x * CELL_SIZE, playEnd.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

                // Gegner (Rot)
                ctx.fillStyle = 'rgba(255, 0, 0, 0.6)';
                ctx.fillRect(enemyPos.x * CELL_SIZE, enemyPos.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

                // Spieler (Blau)
                ctx.fillStyle = '#00BFFF';
                ctx.fillRect(playerPos.x * CELL_SIZE, playerPos.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }
        }

        draw();
    </script>
</body>
</html>
