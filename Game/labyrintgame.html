<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplayer Labyrinth Race Mobile</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { margin: 0; padding: 10px; background: #1a1a1a; color: #fff; font-family: sans-serif; text-align: center; }
        
        /* Responsive Canvas container */
        #canvas-container {
            width: 100%;
            max-width: 500px;
            margin: 10px auto;
            position: relative;
        }

        canvas { 
            background: #000; 
            border: 2px solid #555; 
            display: block; 
            width: 100%; 
            height: auto; 
            touch-action: none; /* Verhindert ungewolltes Scrollen beim Zeichnen auf Handys */
        }

        .controls, .editor-tools { margin: 10px 0; }
        input, button { padding: 10px 14px; margin: 4px; font-weight: bold; border-radius: 6px; border: none; font-size: 14px; }
        button { cursor: pointer; background: #333; color: white; border: 1px solid #666; }
        button.active { background: #4CAF50; color: white; border-color: #4CAF50; }
        #status { font-weight: bold; color: #ffeb3b; font-size: 1.1em; margin: 10px 0; min-height: 1.2em; }
        .highlight { color: #2196F3; font-weight: bold; }

        /* Virtuelles Steuerkreuz für mobile Geräte */
        #dpad {
            display: none;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
            justify-content: center;
            margin: 15px auto;
        }
        #dpad button {
            background: #444;
            color: white;
            font-size: 18px;
            padding: 0;
            margin: 0;
            border: 1px solid #777;
        }
        #dpad button:active { background: #2196F3; }
    </style>
</head>
<body>

    <h1>Labyrinth Race (50x50)</h1>
    <div id="status">Gib deinen Spielernamen ein!</div>

    <div class="controls" id="name-setup">
        <input type="text" id="my-name-input" placeholder="Dein Spielername">
        <button onclick="registerName()" style="background: #4CAF50; color: white;">Name bestätigen</button>
    </div>

    <div class="controls" id="connection-box" style="display: none;">
        <p>Dein Name: <span class="highlight" id="display-my-name"></span></p>
        <hr style="width: 80%; border-color: #444;">
        <input type="text" id="join-name-input" placeholder="Name des Gegners">
        <button onclick="connectToPeer()" style="background: #2196F3; color: white;">Verbinden</button>
    </div>

    <div class="editor-tools" id="editor-tools" style="display: none;">
        <button id="btn-wall" class="active" onclick="setTool('wall')">🧱 Wand platzieren</button>
        <button id="btn-erase" onclick="setTool('erase')">🧹 Wand löschen</button>
        <button id="btn-start" onclick="setTool('start')">🟢 Start setzen</button>
        <button id="btn-end" onclick="setTool('end')">🔴 Ziel setzen</button>
        <br>
        <button style="background: #4CAF50; color: white; margin-top: 8px;" onclick="sendMaze()"> Fertigstellen!</button>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
    </div>

    <div id="dpad">
        <div></div>
        <button onclick="movePlayer(0, -1)">▲</button>
        <div></div>
        <button onclick="movePlayer(-1, 0)">◄</button>
        <div></div>
        <button onclick="movePlayer(1, 0)">►</button>
        <div></div>
        <button onclick="movePlayer(0, 1)">▼</button>
        <div></div>
    </div>

    <script>
        const GRID_SIZE = 50;
        const CELL_SIZE = 10; // Internes Koordinatensystem (500x500 Canvas)
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'name_setup'; 
        let currentTool = 'wall';
        let peer = null;
        let conn = null;

        let myName = "";
        let enemyName = "";

        // Labyrinthe
        let myMaze = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
        let myStart = { x: 0, y: 0 };
        let myEnd = { x: 49, y: 49 };

        let playMaze = null;
        let playStart = { x: 0, y: 0 };
        let playEnd = { x: 49, y: 49 };
        
        let playerPos = { x: 0, y: 0 };
        let enemyPos = { x: 0, y: 0 };

        function registerName() {
            const input = document.getElementById('my-name-input').value.trim();
            if (!input) return alert("Bitte gib einen Namen ein!");

            myName = input;
            peer = new Peer(myName);

            peer.on('open', () => {
                document.getElementById('name-setup').style.display = 'none';
                document.getElementById('connection-box').style.display = 'block';
                document.getElementById('display-my-name').innerText = myName;
                document.getElementById('status').innerText = 'Verbinde dich jetzt mit deinem Gegner!';
                gameState = 'connect';
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert('Dieser Name ist schon vergeben! Wähle einen anderen.');
                } else {
                    alert('Verbindungsfehler: ' + err.type);
                }
            });

            peer.on('connection', (c) => {
                conn = c;
                enemyName = c.peer;
                setupConnection();
            });
        }

        function connectToPeer() {
            enemyName = document.getElementById('join-name-input').value.trim();
            if (!enemyName) return alert("Bitte gib den Namen des Gegners ein!");
            if (enemyName === myName) return alert("Du kannst dich nicht mit dir selbst verbinden!");

            conn = peer.connect(enemyName);
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                startEditingPhase();
            });

            conn.on('data', (data) => {
                if (data.type === 'maze_data') {
                    playMaze = data.maze;
                    playStart = data.start;
                    playEnd = data.end;
                    playerPos = { ...playStart };
                    checkStartGame();
                } else if (data.type === 'player_move') {
                    enemyPos = data.pos;
                    draw();
                } else if (data.type === 'win') {
                    gameState = 'gameover';
                    document.getElementById('status').innerText = `❌ ${enemyName} war schneller! Du hast verloren.`;
                    document.getElementById('dpad').style.display = 'none';
                    draw();
                }
            });
        }

        function startEditingPhase() {
            document.getElementById('connection-box').style.display = 'none';
            document.getElementById('editor-tools').style.display = 'block';
            document.getElementById('status').innerText = `Du baust ein Labyrinth für ${enemyName}!`;
            gameState = 'edit';
            draw();
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.editor-tools button').forEach(b => b.classList.remove('active'));
            if(tool === 'wall') document.getElementById('btn-wall').classList.add('active');
            if(tool === 'erase') document.getElementById('btn-erase').classList.add('active');
            if(tool === 'start') document.getElementById('btn-start').classList.add('active');
            if(tool === 'end') document.getElementById('btn-end').classList.add('active');
        }

        // --- Touch & Maus Steuerung für den Editor ---
        let isDrawing = false;

        function getGridPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // Umrechnung von Bildschirmgröße auf die interne 500x500 Canvas-Größe
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = Math.floor(((clientX - rect.left) * scaleX) / CELL_SIZE);
            const y = Math.floor(((clientY - rect.top) * scaleY) / CELL_SIZE);

            return { x, y };
        }

        function handlePointerStart(e) {
            if (gameState !== 'edit') return;
            isDrawing = true;
            handlePointerMove(e);
        }

        function handlePointerMove(e) {
            if (gameState !== 'edit' || !isDrawing) return;
            const pos = getGridPos(e);

            if (pos.x >= 0 && pos.x < GRID_SIZE && pos.y >= 0 && pos.y < GRID_SIZE) {
                if (currentTool === 'wall') {
                    myMaze[pos.y][pos.x] = 1;
                } else if (currentTool === 'erase') {
                    myMaze[pos.y][pos.x] = 0;
                } else if (currentTool === 'start') {
                    myStart = { x: pos.x, y: pos.y };
                    myMaze[pos.y][pos.x] = 0;
                } else if (currentTool === 'end') {
                    myEnd = { x: pos.x, y: pos.y };
                    myMaze[pos.y][pos.x] = 0;
                }
                draw();
            }
        }

        function handlePointerEnd() { isDrawing = false; }

        // Maus Events
        canvas.addEventListener('mousedown', handlePointerStart);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerEnd);

        // Touch Events für Handys
        canvas.addEventListener('touchstart', (e) => { handlePointerStart(e); e.preventDefault(); });
        canvas.addEventListener('touchmove', (e) => { handlePointerMove(e); e.preventDefault(); });
        canvas.addEventListener('touchend', handlePointerEnd);

        function sendMaze() {
            gameState = 'waiting';
            document.getElementById('editor-tools').style.display = 'none';
            document.getElementById('status').innerText = `Warte auf das Labyrinth von ${enemyName}...`;
            
            conn.send({
                type: 'maze_data',
                maze: myMaze,
                start: myStart,
                end: myEnd
            });

            checkStartGame();
        }

        function checkStartGame() {
            if (gameState === 'waiting' && playMaze !== null) {
                gameState = 'play';
                document.getElementById('status').innerText = `🚀 LOS! Erreiche das Ziel vor ${enemyName}!`;
                document.getElementById('dpad').style.display = 'grid'; // D-Pad aktivieren
                draw();
            }
        }

        // --- Bewegung der Figur ---
        function movePlayer(dx, dy) {
            if (gameState !== 'play') return;

            let newX = playerPos.x + dx;
            let newY = playerPos.y + dy;

            if (newX >= 0 && newX < GRID_SIZE && newY >= 0 && newY < GRID_SIZE) {
                if (playMaze[newY][newX] !== 1) {
                    playerPos.x = newX;
                    playerPos.y = newY;

                    conn.send({ type: 'player_move', pos: playerPos });

                    if (playerPos.x === playEnd.x && playerPos.y === playEnd.y) {
                        gameState = 'gameover';
                        document.getElementById('status').innerText = `🏆 GEWONNEN! ${myName} ist im Ziel!`;
                        document.getElementById('dpad').style.display = 'none';
                        conn.send({ type: 'win' });
                    }

                    draw();
                }
            }
        }

        // Tastatursteuerung für Desktop-PCs
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') movePlayer(0, -1);
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') movePlayer(0, 1);
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') movePlayer(-1, 0);
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') movePlayer(1, 0);
        });

        // --- Grafik zeichnen ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'edit' || gameState === 'waiting') {
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (myMaze[r][c] === 1) {
                            ctx.fillStyle = '#888';
                            ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                        }
                    }
                }
                ctx.fillStyle = '#00FF00';
                ctx.fillRect(myStart.x * CELL_SIZE, myStart.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                ctx.fillStyle = '#FF0000';
                ctx.fillRect(myEnd.x * CELL_SIZE, myEnd.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

            } else if (gameState === 'play' || gameState === 'gameover') {
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (playMaze[r][c] === 1) {
                            ctx.fillStyle = '#444';
                            ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                        }
                    }
                }
                // Ziel
                ctx.fillStyle = '#00FF00';
                ctx.fillRect(playEnd.x * CELL_SIZE, playEnd.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

                // Gegner (Schatten)
                ctx.fillStyle = 'rgba(255, 0, 0, 0.6)';
                ctx.fillRect(enemyPos.x * CELL_SIZE, enemyPos.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

                // Spieler (Blau)
                ctx.fillStyle = '#00BFFF';
                ctx.fillRect(playerPos.x * CELL_SIZE, playerPos.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }
        }

        draw();
    </script>
</body>
</html>
