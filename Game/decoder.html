<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamster Connect - P2P Dateitransfer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.35);
            --text: #f0f6fc;
            --muted: #8b949e;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            max-width: 850px;
            margin: 0 auto;
            padding: 30px 20px;
            background-color: var(--bg);
            color: var(--text);
        }

        /* --- Header & Maskottchen Animation --- */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .mascot-container {
            font-size: 65px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
            cursor: pointer;
            user-select: none;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            margin: 10px 0 5px 0;
            font-size: 32px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- UI Layout --- */
        .container {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            flex: 1;
            min-width: 320px;
            border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        h2 { margin-top: 0; color: var(--accent); font-size: 20px; }

        /* --- Input & Button Styling --- */
        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border-radius: 12px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        button:hover {
            opacity: 0.95;
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
        }

        /* --- Code Box --- */
        .code-box {
            background: #0d1117;
            border: 2px dashed var(--accent);
            padding: 15px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 8px;
            color: var(--accent);
            margin-top: 15px;
            border-radius: 12px;
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 var(--accent-glow); }
            70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        /* --- Fortgeschrittene Animationen --- */
        .status-container {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            min-height: 40px;
            background: #0d1117;
            padding: 10px 15px;
            border-radius: 10px;
        }

        /* Hamster-Rad Lade-Animation */
        .hamster-wheel {
            width: 28px;
            height: 28px;
            border: 3px solid #30363d;
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #0d1117;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f59e0b, #10b981);
            transition: width 0.4s ease-out;
            border-radius: 6px;
        }

        .status-text {
            font-size: 14px;
            color: var(--muted);
        }

        /* Ausblend-Animationen */
        .fade-in {
            animation: fadeIn 0.5s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="mascot-container" id="mascot">🐹</div>
        <h1>Hamster Connect</h1>
        <p style="color: var(--muted); margin: 0;">Schnelle P2P-Dateiübertragung direkt von PC zu PC.</p>
    </div>

    <div class="container">
        <!-- SENDER (HOST) -->
        <div class="card">
            <div>
                <h2>1. Datei senden</h2>
                <input type="file" id="fileInput">
                <button onclick="startHosting()">Datei freigeben & Code holen</button>

                <div id="hostSection" style="display: none;" class="fade-in">
                    <p style="margin-bottom: 5px; margin-top: 15px; font-size: 14px;">Dein Download-Code:</p>
                    <div class="code-box" id="shareCode">------</div>
                </div>
            </div>

            <div>
                <div class="progress-bar-container" id="hostProgressBox">
                    <div class="progress-bar" id="hostProgressBar"></div>
                </div>
                <div class="status-container">
                    <div class="hamster-wheel" id="hostWheel"></div>
                    <div class="status-text" id="hostStatus">Wähle eine Datei zum Senden.</div>
                </div>
            </div>
        </div>

        <!-- EMPFÄNGER -->
        <div class="card">
            <div>
                <h2>2. Datei empfangen</h2>
                <input type="text" id="joinCode" placeholder="6-stelligen Code eingeben" maxlength="6">
                <button onclick="downloadFile()">Verbinden & Laden</button>
            </div>

            <div>
                <div class="progress-bar-container" id="downloadProgressBox">
                    <div class="progress-bar" id="downloadProgressBar"></div>
                </div>
                <div class="status-container">
                    <div class="hamster-wheel" id="downloadWheel"></div>
                    <div class="status-text" id="downloadStatus">Gib den Code des Senders ein.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let selectedFile = null;

        function setMascot(emoji) {
            document.getElementById('mascot').textContent = emoji;
        }

        function generateCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // --- SENDER / HOST ---
        function startHosting() {
            const fileInput = document.getElementById('fileInput');
            const hostStatus = document.getElementById('hostStatus');
            const hostWheel = document.getElementById('hostWheel');
            const hostProgressBox = document.getElementById('hostProgressBox');
            const hostProgressBar = document.getElementById('hostProgressBar');

            if (!fileInput.files.length) {
                alert("Bitte wähle zuerst eine Datei aus!");
                return;
            }

            selectedFile = fileInput.files[0];
            const code = generateCode();

            // UI Zustand aktualisieren
            setMascot('🐹');
            hostWheel.style.display = 'block';
            hostStatus.textContent = "Server wird gestartet...";

            peer = new Peer('hamster-connect-' + code);

            peer.on('open', () => {
                document.getElementById('hostSection').style.display = 'block';
                document.getElementById('shareCode').textContent = code;
                hostStatus.textContent = "Warte auf Empfänger... (Tab offen lassen)";
            });

            peer.on('connection', (conn) => {
                setMascot('⚡');
                hostStatus.textContent = "Empfänger verbunden! Hamster läuft...";
                hostProgressBox.style.display = 'block';
                hostProgressBar.style.width = '30%';

                conn.on('open', () => {
                    hostProgressBar.style.width = '70%';
                    conn.send({
                        name: selectedFile.name,
                        type: selectedFile.type,
                        file: selectedFile
                    });

                    setTimeout(() => {
                        hostProgressBar.style.width = '100%';
                        hostWheel.style.display = 'none';
                        setMascot('🎉');
                        hostStatus.textContent = "Datei erfolgreich gesendet!";
                    }, 600);
                });
            });

            peer.on('error', (err) => {
                hostWheel.style.display = 'none';
                setMascot('❌');
                hostStatus.textContent = "Fehler beim Erstellen des Servers.";
            });
        }

        // --- EMPFÄNGER ---
        function downloadFile() {
            const code = document.getElementById('joinCode').value.trim();
            const downloadStatus = document.getElementById('downloadStatus');
            const downloadWheel = document.getElementById('downloadWheel');
            const downloadProgressBox = document.getElementById('downloadProgressBox');
            const downloadProgressBar = document.getElementById('downloadProgressBar');

            if (code.length !== 6) {
                alert("Bitte gib den 6-stelligen Code ein.");
                return;
            }

            // UI Zustand aktualisieren
            setMascot('🔍');
            downloadWheel.style.display = 'block';
            downloadProgressBox.style.display = 'block';
            downloadProgressBar.style.width = '20%';
            downloadStatus.textContent = "Suche Sender-Hamster...";

            const receiverPeer = new Peer();

            receiverPeer.on('open', () => {
                const conn = receiverPeer.connect('hamster-connect-' + code);

                downloadProgressBar.style.width = '50%';

                conn.on('open', () => {
                    setMascot('🚀');
                    downloadStatus.textContent = "Verbunden! Lade Daten herunter...";
                    downloadProgressBar.style.width = '75%';
                });

                conn.on('data', (data) => {
                    downloadProgressBar.style.width = '90%';
                    downloadStatus.textContent = "Speichere Datei...";

                    const blob = new Blob([data.file], { type: data.type });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = data.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    // Erfolgs-Animation & Maskottchen
                    downloadProgressBar.style.width = '100%';
                    downloadWheel.style.display = 'none';
                    setMascot('🥳');
                    downloadStatus.textContent = "Fertig! " + data.name + " heruntergeladen.";
                });
            });

            receiverPeer.on('error', (err) => {
                downloadWheel.style.display = 'none';
                downloadProgressBox.style.display = 'none';
                setMascot('😢');
                downloadStatus.textContent = "Fehler: Code falsch oder Sender offline.";
            });
        }
    </script>
</body>
</html>
