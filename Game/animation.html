<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Pro Logo Animator v12 - Perfect Pixel GIF</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    h1 { margin-top: 0; font-size: 1.6rem; text-align: center; }
    p.subtitle { text-align: center; color: var(--text-dim); margin-bottom: 20px; font-size: 0.9rem; }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .main-layout { grid-template-columns: 1fr; }
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      background: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .control-group { display: flex; flex-direction: column; gap: 6px; position: relative; }
    .label-row { display: flex; justify-content: space-between; align-items: center; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--text-dim); }

    .arrow-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0 4px;
    }

    input, select {
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text);
      padding: 8px;
      border-radius: 6px;
      outline: none;
    }

    input[type="color"] { height: 38px; padding: 2px; cursor: pointer; }

    .curve-panel {
      display: none;
      background: #090d16;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      margin-top: 6px;
      flex-direction: column;
      gap: 8px;
    }
    .curve-panel.open { display: flex; }

    .curve-svg {
      width: 100%;
      height: 100px;
      background: #0f172a;
      border-radius: 6px;
      border: 1px solid #334155;
      touch-action: none;
    }

    .handle {
      fill: #3b82f6;
      stroke: #ffffff;
      stroke-width: 1.5;
      cursor: pointer;
    }

    .handle-line {
      stroke: #475569;
      stroke-width: 1;
      stroke-dasharray: 2 2;
    }

    .btn-group {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
    }

    button.main-btn {
      flex: 1;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.main-btn:hover { background: var(--accent-hover); }
    button.main-btn:disabled { background: #475569; cursor: not-allowed; }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      border-radius: 12px;
      min-height: 350px;
      border: 2px dashed #334155;
      padding: 15px;
    }

    canvas { max-width: 100%; height: auto; border-radius: 4px; cursor: crosshair; }
    #status { margin-top: 12px; color: var(--accent); font-weight: 600; font-size: 0.9rem; text-align: center; }

    .color-sidebar {
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      padding: 15px;
      border: 1px solid #334155;
      max-height: 520px;
      overflow-y: auto;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .sidebar-header h3 { font-size: 0.95rem; margin: 0; }

    .color-bar-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px;
      border-radius: 6px;
    }

    .color-bar-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .color-swatch { width: 14px; height: 14px; border-radius: 3px; }
    .color-bar-input { width: 100%; height: 6px; cursor: pointer; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
</head>
<body>

<div class="app-container">
  <h1>Pro Logo Animator v12</h1>
  <p class="subtitle">Interaktives Diagramm & Exakter GIF-Export.</p>

  <div class="controls">
    <div class="control-group">
      <label for="upload">1. PNG Bild</label>
      <input type="file" id="upload" accept="image/png">
    </div>

    <div class="control-group">
      <label for="lineColor">2. Linienfarbe</label>
      <input type="color" id="lineColor" value="#3b82f6">
    </div>

    <div class="control-group">
      <label for="angle">3. Winkel (0° - 360°)</label>
      <input type="number" id="angle" value="90" min="0" max="360">
    </div>

    <div class="control-group">
      <div class="label-row">
        <label for="speed">4. Geschw. (Frames)</label>
        <button class="arrow-btn" onclick="togglePanel('speedCurvePanel')">▼ Diagramm</button>
      </div>
      <input type="number" id="speed" min="10" max="100" value="30">
      <div id="speedCurvePanel" class="curve-panel">
        <label>Kurve anpassen (Punkte ziehen):</label>
        <svg class="curve-svg" id="speedSvg" viewBox="0 0 100 100">
          <line id="l1" class="handle-line" x1="0" y1="100" x2="25" y2="75" />
          <line id="l2" class="handle-line" x1="100" y1="0" x2="75" y2="25" />
          <path id="bezierPath" d="M 0 100 C 25 75, 75 25, 100 0" stroke="#3b82f6" stroke-width="3" fill="none" />
          <circle id="h1" class="handle" cx="25" cy="75" r="5" />
          <circle id="h2" class="handle" cx="75" cy="25" r="5" />
        </svg>
      </div>
    </div>

    <div class="control-group">
      <label for="threshold">5. Empfindlichkeit</label>
      <input type="range" id="threshold" min="10" max="150" value="40">
    </div>

    <div class="btn-group">
      <button class="main-btn" id="resetSelectionBtn" style="background:#64748b;">Auswahl Reset</button>
      <button class="main-btn" id="playBtn" disabled>Vorschau Abspielen</button>
      <button class="main-btn" id="downloadBtn" disabled style="background:#10b981;">Perfektes .GIF Herunterladen</button>
    </div>
  </div>

  <div class="main-layout">
    <div class="stage">
      <canvas id="displayCanvas"></canvas>
      <div id="status">Bitte lade ein PNG-Bild hoch.</div>
    </div>

    <div class="color-sidebar">
      <div class="sidebar-header">
        <h3>Farb-Delays</h3>
        <label style="font-size: 0.75rem; cursor: pointer;">
          <input type="checkbox" id="enableColorDelays" checked> Aktiviert
        </label>
      </div>
      <div id="colorListContainer">
        <div id="colorList">Bitte zuerst ein Bild hochladen.</div>
      </div>
    </div>
  </div>
</div>

<script>
  const upload = document.getElementById('upload');
  const lineColorInput = document.getElementById('lineColor');
  const angleInput = document.getElementById('angle');
  const speedInput = document.getElementById('speed');
  const thresholdInput = document.getElementById('threshold');
  const enableColorDelaysCheckbox = document.getElementById('enableColorDelays');

  const playBtn = document.getElementById('playBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const resetSelectionBtn = document.getElementById('resetSelectionBtn');
  const statusDiv = document.getElementById('status');
  const colorListDiv = document.getElementById('colorList');
  const canvas = document.getElementById('displayCanvas');
  const ctx = canvas.getContext('2d');

  let img = new Image();
  let imgLoaded = false;
  let isAnimating = false;

  let isSelecting = false;
  let selection = null;
  let startX = 0, startY = 0;
  let detectedColors = [];

  let cp1 = { x: 0.25, y: 0.25 };
  let cp2 = { x: 0.75, y: 0.75 };

  function togglePanel(id) {
    document.getElementById(id).classList.toggle('open');
  }

  // --- DIAGRAMM LOGIK ---
  const svg = document.getElementById('speedSvg');
  const h1 = document.getElementById('h1');
  const h2 = document.getElementById('h2');
  const l1 = document.getElementById('l1');
  const l2 = document.getElementById('l2');
  const bezierPath = document.getElementById('bezierPath');
  let activeHandle = null;

  function updateSvgPath() {
    const x1 = cp1.x * 100, y1 = (1 - cp1.y) * 100;
    const x2 = cp2.x * 100, y2 = (1 - cp2.y) * 100;

    h1.setAttribute('cx', x1); h1.setAttribute('cy', y1);
    h2.setAttribute('cx', x2); h2.setAttribute('cy', y2);

    l1.setAttribute('x2', x1); l1.setAttribute('y2', y1);
    l2.setAttribute('x2', x2); l2.setAttribute('y2', y2);

    bezierPath.setAttribute('d', `M 0 100 C ${x1} ${y1}, ${x2} ${y2}, 100 0`);
  }

  function getSvgCoords(e) {
    const rect = svg.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const y = Math.max(0, Math.min(1, 1 - (e.clientY - rect.top) / rect.height));
    return { x, y };
  }

  h1.addEventListener('pointerdown', (e) => { activeHandle = 1; e.stopPropagation(); });
  h2.addEventListener('pointerdown', (e) => { activeHandle = 2; e.stopPropagation(); });

  window.addEventListener('pointermove', (e) => {
    if (!activeHandle) return;
    const coords = getSvgCoords(e);
    if (activeHandle === 1) cp1 = coords;
    if (activeHandle === 2) cp2 = coords;
    updateSvgPath();
  });

  window.addEventListener('pointerup', () => { activeHandle = null; });
  updateSvgPath();

  function getCubicBezierProgress(t) {
    let u = 1 - t;
    let tt = t * t, uu = u * u;
    let uuu = uu * u, ttt = tt * t;
    let y = uuu * 0 + 3 * uu * t * cp1.y + 3 * u * tt * cp2.y + ttt * 1;
    return Math.max(0, Math.min(1, y));
  }

  // --- BILD UPLOAD & FARBEN ---
  upload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > 400) { h = Math.round((h * 400) / w); w = 400; }
        canvas.width = w; canvas.height = h;

        selection = null;
        drawBaseImage();
        extractColors();
        imgLoaded = true;
        playBtn.disabled = false;
        downloadBtn.disabled = false;
        statusDiv.innerText = "Bild geladen! Bereit zur Animation.";
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  function extractColors() {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(img, 0, 0, canvas.width, canvas.height);

    const data = tempCtx.getImageData(0, 0, canvas.width, canvas.height).data;
    const colorMap = {};

    for (let i = 0; i < data.length; i += 16) {
      const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
      if (a < 50) continue;

      const qr = Math.round(r / 32) * 32;
      const qg = Math.round(g / 32) * 32;
      const qb = Math.round(b / 32) * 32;
      const key = `${qr},${qg},${qb}`;
      colorMap[key] = (colorMap[key] || 0) + 1;
    }

    const sorted = Object.keys(colorMap).sort((a,b) => colorMap[b] - colorMap[a]).slice(0, 8);

    detectedColors = sorted.map((key, index) => {
      const [r, g, b] = key.split(',').map(Number);
      const hex = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      return { rgb: { r, g, b }, hex: hex, delayPercent: index * 10 };
    });

    renderColorBars();
  }

  function renderColorBars() {
    colorListDiv.innerHTML = '';
    detectedColors.forEach((colorItem, idx) => {
      const item = document.createElement('div');
      item.className = 'color-bar-item';
      item.innerHTML = `
        <div class="color-bar-header">
          <div class="color-swatch" style="background:${colorItem.hex}"></div>
          <span>${colorItem.hex.toUpperCase()}</span>
          <span style="margin-left:auto; color:var(--text-dim);" id="val-${idx}">${colorItem.delayPercent}%</span>
        </div>
        <input type="range" class="color-bar-input" min="0" max="80" value="${colorItem.delayPercent}" data-idx="${idx}">
      `;
      colorListDiv.appendChild(item);
    });

    document.querySelectorAll('.color-bar-input').forEach(input => {
      input.addEventListener('input', (e) => {
        const idx = e.target.getAttribute('data-idx');
        const val = parseInt(e.target.value, 10);
        detectedColors[idx].delayPercent = val;
        document.getElementById(`val-${idx}`).innerText = `${val}%`;
      });
    });
  }

  function drawBaseImage() {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    if (selection) {
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.strokeRect(selection.x, selection.y, selection.w, selection.h);
      ctx.setLineDash([]);
    }
  }

  canvas.addEventListener('mousedown', (e) => {
    if (!imgLoaded || isAnimating) return;
    const rect = canvas.getBoundingClientRect();
    startX = (e.clientX - rect.left) * (canvas.width / rect.width);
    startY = (e.clientY - rect.top) * (canvas.height / rect.height);
    isSelecting = true;
  });

  canvas.addEventListener('mousemove', (e) => {
    if (!isSelecting) return;
    const rect = canvas.getBoundingClientRect();
    const curX = (e.clientX - rect.left) * (canvas.width / rect.width);
    const curY = (e.clientY - rect.top) * (canvas.height / rect.height);

    selection = {
      x: Math.min(startX, curX), y: Math.min(startY, curY),
      w: Math.abs(curX - startX), h: Math.abs(curY - startY)
    };
    drawBaseImage();
  });

  canvas.addEventListener('mouseup', () => {
    if (isSelecting) {
      isSelecting = false;
      if (selection && (selection.w < 5 || selection.h < 5)) selection = null;
      drawBaseImage();
    }
  });

  resetSelectionBtn.addEventListener('click', () => {
    selection = null;
    if (imgLoaded) drawBaseImage();
  });

  function getEdges(width, height, threshold) {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = width; tempCanvas.height = height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(img, 0, 0, width, height);

    const data = tempCtx.getImageData(0, 0, width, height).data;
    const edgeData = new Uint8ClampedArray(width * height);

    for (let y = 1; y < height - 1; y++) {
      for (let x = 1; x < width - 1; x++) {
        let gx = 0, gy = 0;
        for (let cy = -1; cy <= 1; cy++) {
          for (let cx = -1; cx <= 1; cx++) {
            const idx = ((y + cy) * width + (x + cx)) * 4;
            const val = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
            if (cx === -1) gx -= val * (cy === 0 ? 2 : 1);
            if (cx === 1)  gx += val * (cy === 0 ? 2 : 1);
            if (cy === -1) gy -= val * (cx === 0 ? 2 : 1);
            if (cy === 1)  gy += val * (cx === 0 ? 2 : 1);
          }
        }
        edgeData[y * width + x] = Math.sqrt(gx * gx + gy * gy) > threshold ? 255 : 0;
      }
    }
    return edgeData;
  }

  function getColorDelay(r, g, b) {
    if (!enableColorDelaysCheckbox.checked) return 0;
    let closestDelay = 0, minDiff = Infinity;
    detectedColors.forEach(item => {
      const diff = Math.abs(item.rgb.r - r) + Math.abs(item.rgb.g - g) + Math.abs(item.rgb.b - b);
      if (diff < minDiff) { minDiff = diff; closestDelay = item.delayPercent; }
    });
    return closestDelay / 100;
  }

  function renderAnimationFrame(frame, totalFrames, edges, lineColor, dirX, dirY, roi, rawImgData) {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const rawProgress = frame / totalFrames;
    const progress = getCubicBezierProgress(rawProgress);

    ctx.fillStyle = '#090d16';
    ctx.fillRect(0, 0, w, h);

    const edgeCanvas = ctx.createImageData(w, h);
    const edgePixels = edgeCanvas.data;
    const maxDist = Math.abs(roi.w * dirX) + Math.abs(roi.h * dirY);

    for (let y = Math.floor(roi.y); y < Math.floor(roi.y + roi.h); y++) {
      for (let x = Math.floor(roi.x); x < Math.floor(roi.x + roi.w); x++) {
        const idx = y * w + x;
        if (edges[idx] === 255) {
          const proj = (x - roi.x) * dirX + (y - roi.y) * dirY;
          if (proj <= maxDist * Math.min(progress * 2.0, 1)) {
            const pxIdx = idx * 4;
            edgePixels[pxIdx] = lineColor.r;
            edgePixels[pxIdx + 1] = lineColor.g;
            edgePixels[pxIdx + 2] = lineColor.b;
            edgePixels[pxIdx + 3] = 255;
          }
        }
      }
    }

    const tempC = document.createElement('canvas');
    tempC.width = w; tempC.height = h;
    tempC.getContext('2d').putImageData(edgeCanvas, 0, 0);
    ctx.drawImage(tempC, 0, 0);

    if (progress > 0.2) {
      const fillCanvas = ctx.createImageData(w, h);
      const fillPixels = fillCanvas.data;

      for (let y = Math.floor(roi.y); y < Math.floor(roi.y + roi.h); y++) {
        for (let x = Math.floor(roi.x); x < Math.floor(roi.x + roi.w); x++) {
          const pxIdx = (y * w + x) * 4;
          const r = rawImgData[pxIdx], g = rawImgData[pxIdx+1], b = rawImgData[pxIdx+2], a = rawImgData[pxIdx+3];

          if (a > 50) {
            const colorDelay = getColorDelay(r, g, b);
            const effectiveProgress = Math.max(0, (progress - 0.2 - colorDelay) / (0.8 - colorDelay));

            if (effectiveProgress > 0) {
              fillPixels[pxIdx] = r;
              fillPixels[pxIdx+1] = g;
              fillPixels[pxIdx+2] = b;
              fillPixels[pxIdx+3] = Math.min(effectiveProgress * 255, a);
            }
          }
        }
      }

      const fillTempC = document.createElement('canvas');
      fillTempC.width = w; fillTempC.height = h;
      fillTempC.getContext('2d').putImageData(fillCanvas, 0, 0);
      ctx.drawImage(fillTempC, 0, 0);
    }

    if (progress > 0.7) {
      ctx.globalAlpha = (progress - 0.7) / 0.3;
      ctx.drawImage(img, 0, 0, w, h);
      ctx.globalAlpha = 1.0;
    }
  }

  playBtn.addEventListener('click', () => {
    if (!imgLoaded || isAnimating) return;
    runAnimation();
  });

  function runAnimation() {
    isAnimating = true;
    playBtn.disabled = true; downloadBtn.disabled = true;
    statusDiv.innerText = "Spiele Vorschau ab...";

    const w = canvas.width, h = canvas.height;
    const edges = getEdges(w, h, parseInt(thresholdInput.value, 10));

    const rgb = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(lineColorInput.value);
    const lineColor = rgb ? { r: parseInt(rgb[1], 16), g: parseInt(rgb[2], 16), b: parseInt(rgb[3], 16) } : { r: 59, g: 130, b: 246 };

    const rad = (parseInt(angleInput.value, 10) * Math.PI) / 180;
    const dirX = Math.cos(rad), dirY = Math.sin(rad);

    const totalFrames = parseInt(speedInput.value, 10);
    const roi = selection || { x: 0, y: 0, w: w, h: h };
    let frame = 0;

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = w; tempCanvas.height = h;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(img, 0, 0, w, h);
    const rawImgData = tempCtx.getImageData(0, 0, w, h).data;

    function step() {
      renderAnimationFrame(frame, totalFrames, edges, lineColor, dirX, dirY, roi, rawImgData);
      frame++;

      if (frame <= totalFrames) {
        setTimeout(step, 30);
      } else {
        isAnimating = false;
        playBtn.disabled = false; downloadBtn.disabled = false;
        statusDiv.innerText = "Vorschau beendet.";
      }
    }
    step();
  }

  // --- GIF.JS EXPORT MIT INLINE WORKER (EXAKTE QUALITÄT) ---
  downloadBtn.addEventListener('click', () => {
    if (!imgLoaded || isAnimating) return;
    isAnimating = true;
    playBtn.disabled = true; downloadBtn.disabled = true;

    statusDiv.innerText = "Render GIF in perfekter Qualität...";

    setTimeout(() => {
      const w = canvas.width, h = canvas.height;
      const edges = getEdges(w, h, parseInt(thresholdInput.value, 10));

      const rgb = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(lineColorInput.value);
      const lineColor = rgb ? { r: parseInt(rgb[1], 16), g: parseInt(rgb[2], 16), b: parseInt(rgb[3], 16) } : { r: 59, g: 130, b: 246 };

      const rad = (parseInt(angleInput.value, 10) * Math.PI) / 180;
      const dirX = Math.cos(rad), dirY = Math.sin(rad);

      const totalFrames = parseInt(speedInput.value, 10);
      const roi = selection || { x: 0, y: 0, w: w, h: h };

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = w; tempCanvas.height = h;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(img, 0, 0, w, h);
      const rawImgData = tempCtx.getImageData(0, 0, w, h).data;

      // Fetch standard worker script & inline it as a Blob to prevent CORS blocks
      fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js')
        .then(response => response.text())
        .then(workerCode => {
          const blobWorker = new Blob([workerCode], { type: 'application/javascript' });
          const workerUrl = URL.createObjectURL(blobWorker);

          const gif = new GIF({
            workers: 2,
            quality: 1, // Höchste Qualität (Keine Artefakte)
            width: w,
            height: h,
            workerScript: workerUrl
          });

          for (let frame = 0; frame <= totalFrames; frame++) {
            renderAnimationFrame(frame, totalFrames, edges, lineColor, dirX, dirY, roi, rawImgData);
            gif.addFrame(ctx, { copy: true, delay: 40 });
          }

          gif.on('finished', function(blob) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'logo-animation-perfect.gif';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            isAnimating = false;
            playBtn.disabled = false; downloadBtn.disabled = false;
            statusDiv.innerText = "Perfektes GIF heruntergeladen!";
          });

          gif.render();
        })
        .catch(err => {
          isAnimating = false;
          playBtn.disabled = false; downloadBtn.disabled = false;
          statusDiv.innerText = "Fehler beim GIF-Export: " + err.message;
        });

    }, 50);
  });
</script>

</body>
</html>
