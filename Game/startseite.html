<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass Startseite</title>
    <style>
        /* --- CSS Variablen & Liquid Theme --- */
        :root {
            --accent-color: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.4);
            --font-size-base: 16px;
            --transition-speed: 0.4s;
        }

        body[data-theme="dark"] {
            --bg-primary: #0d0f18;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
            --input-bg: rgba(255, 255, 255, 0.08);
            --hover-bg: rgba(255, 255, 255, 0.15);
            --danger-color: #ff4757;
        }

        body[data-theme="light"] {
            --bg-primary: #e0e5ec;
            --card-bg: rgba(255, 255, 255, 0.45);
            --card-border: rgba(255, 255, 255, 0.6);
            --text-main: #1a1a1a;
            --text-sub: #555555;
            --input-bg: rgba(255, 255, 255, 0.5);
            --hover-bg: rgba(255, 255, 255, 0.7);
            --danger-color: #dc2626;
        }

        /* Animationen deaktivieren */
        body.no-animations *,
        body.no-animations *::before,
        body.no-animations *::after {
            transition: none !important;
            animation: none !important;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: var(--font-size-base);
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* Fixed Background Orbs */
        .liquid-bg {
            position: fixed;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            animation: float 18s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: var(--accent-color);
            top: -100px;
            left: -100px;
            transition: background 0.5s ease;
        }

        .orb-2 {
            width: 550px;
            height: 550px;
            background: #7928ca;
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 50px) scale(1.1); }
            100% { transform: translate(-50px, 100px) scale(0.9); }
        }

        /* Diagonal Wipe Transition */
        .diagonal-wipe {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            background: var(--bg-primary);
            clip-path: polygon(-50% 0, -50% 0, -50% 100%, -50% 100%);
        }

        .diagonal-wipe.animating {
            animation: diagonalSweep 0.75s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        @keyframes diagonalSweep {
            0% { clip-path: polygon(-50% 0, -50% 0, -50% 100%, -50% 100%); }
            50% { clip-path: polygon(0% 0, 150% 0, 50% 100%, -50% 100%); }
            100% { clip-path: polygon(200% 0, 200% 0, 200% 100%, 200% 100%); }
        }

        /* Top Bar Navigation */
        .top-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            gap: 10px;
            animation: flyInTop 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .icon-btn {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-color: var(--accent-color);
        }

        /* Layout Container */
        .page-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 200px 20px 40px;
            gap: 100px;
        }

        /* Hero Section Container */
        .glass-container {
            background: var(--card-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 45px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            opacity: 0;
            animation: flyInMain 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        @keyframes flyInMain {
            0% { opacity: 0; transform: translateY(100px) scale(0.85); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes flyInTop {
            0% { opacity: 0; transform: translateY(-50px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Clock Widget */
        .clock {
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 2px;
        }

        .date {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Search Form & Select */
        .search-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .engine-select {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0 15px;
            border-radius: 20px;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-size: 0.9rem;
        }

        .engine-select option {
            background: var(--bg-primary);
            color: var(--text-main);
        }

        .search-input {
            flex: 1;
            padding: 18px 24px;
            font-size: 1rem;
            color: var(--text-main);
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: var(--text-sub);
        }

        .search-input:focus {
            background: var(--hover-bg);
            border-color: var(--accent-color);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        .search-btn {
            padding: 18px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #0d0f18;
            background: var(--accent-color);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .search-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.15);
        }

        /* Dynamic Shortcuts */
        .shortcuts {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .shortcut-card {
            display: flex;
            align-items: center;
            padding: 10px 18px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .shortcut-card:hover {
            background: var(--hover-bg);
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        /* Scroll-Indicator */
        .scroll-hint {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--text-sub);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        /* --- Scroll Animationen & Suchmaschinen-Showcase --- */
        .engine-showcase {
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            gap: 34px;
            align-items: center;
            justify-content: center;
            padding-top: 170vh;
            padding-bottom: 180px;
            min-height: 200vh;
            position: relative;
        }

        .engine-showcase::before {
            content: "";
            position: absolute;
            inset: 10% 8% 0;
            background: radial-gradient(circle at center, rgba(0, 242, 254, 0.12), transparent 60%);
            filter: blur(30px);
            pointer-events: none;
        }

        .engine-heading {
            font-size: clamp(2.1rem, 4vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.5px;
            text-align: center;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }

        .engine-track {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .engine-logo {
            position: relative;
            width: min(480px, 86vw);
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.28), 0 0 30px rgba(0, 242, 254, 0.08);
            opacity: 0;
            visibility: hidden;
            transform: translateY(160px) rotateY(90deg) scale(0.8);
            transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.3s ease,
                        visibility 0.2s ease,
                        box-shadow 0.3s ease;
        }

        .engine-logo:hover {
            border-color: var(--accent-color);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.3), 0 0 35px rgba(0, 242, 254, 0.18);
        }

        .engine-logo.visible {
            opacity: 1;
            visibility: visible;
            animation: spinLogo 1.35s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes spinLogo {
            0% {
                transform: translateY(160px) rotateY(90deg) scale(0.8);
            }
            55% {
                transform: translateY(-12px) rotateY(540deg) scale(1.06);
            }
            100% {
                transform: translateY(0) rotateY(720deg) scale(1);
            }
        }

        .engine-logo img {
            display: block;
            max-width: 72%;
            max-height: 92px;
            object-fit: contain;
            filter: drop-shadow(0 10px 14px rgba(0,0,0,0.18));
        }

        /* To-Do Section */
        .todo-section {
            border-top: 1px solid var(--card-border);
            padding-top: 20px;
            margin-top: 10px;
        }

        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .todo-add-btn {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 16px;
            padding: 0 18px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .todo-add-btn:hover {
            background: var(--accent-color);
            color: #0d0f18;
        }

        .todo-list {
            list-style: none;
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--input-bg);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            border: 1px solid var(--card-border);
        }

        .todo-item button {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-weight: bold;
        }

        /* --- Settings Modal --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            visibility: visible;
            z-index: 1000;
            transition: opacity var(--transition-speed) ease, visibility var(--transition-speed) ease;
        }

        .modal-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .modal-card {
            background: var(--bg-primary);
            width: 90%;
            max-width: 620px;
            border-radius: 28px;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            transform: scale(1);
            transition: transform var(--transition-speed) cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: var(--text-main);
        }

        .modal-overlay.hidden .modal-card {
            transform: scale(0.95);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.25rem;
        }

        .close-btn:hover {
            background: var(--hover-bg);
            color: var(--text-main);
        }

        .modal-body {
            display: flex;
            min-height: 360px;
        }

        .settings-nav {
            width: 180px;
            border-right: 1px solid var(--card-border);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(0, 0, 0, 0.05);
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 10px 14px;
            border-radius: 12px;
            text-align: left;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .nav-btn:hover {
            background: var(--hover-bg);
            color: var(--text-main);
        }

        .nav-btn.active {
            background: var(--accent-color);
            color: #0d0f18;
            font-weight: 600;
        }

        .settings-content {
            flex: 1;
            padding: 24px;
            position: relative;
            max-height: 420px;
            overflow-y: auto;
        }

        .tab-pane {
            display: none;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.25s ease-in-out;
        }

        .tab-pane.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .setting-label {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .setting-label span {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .setting-label small {
            color: var(--text-sub);
            font-size: 0.82rem;
        }

        .theme-switch-btn {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            width: 64px;
            height: 34px;
            border-radius: 30px;
            cursor: pointer;
            position: relative;
            padding: 3px;
            display: flex;
            align-items: center;
            transition: border-color 0.3s ease;
        }

        .theme-switch-btn:hover {
            border-color: var(--accent-color);
        }

        .icon-wrapper {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 3px;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55), background-color 0.3s;
        }

        .icon-wrapper svg {
            width: 16px;
            height: 16px;
            fill: #0d0f18;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.3s;
        }

        .icon-sun {
            position: absolute;
            opacity: 0;
            transform: rotate(-180deg) scale(0.5);
        }

        .icon-moon {
            position: absolute;
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        body[data-theme="light"] .icon-wrapper {
            transform: translateX(30px);
        }

        body[data-theme="light"] .icon-sun {
            opacity: 1;
            transform: rotate(360deg) scale(1);
        }

        body[data-theme="light"] .icon-moon {
            opacity: 0;
            transform: rotate(180deg) scale(0.5);
        }

        .color-options { display: flex; gap: 8px; }
        .color-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-btn.active { border-color: var(--text-main); transform: scale(1.15); }

        .custom-select {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
            flex-shrink: 0;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: var(--card-border);
            transition: 0.3s;
            border-radius: 34px;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: #fff;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent-color); }
        input:checked + .slider::before { transform: translateX(22px); }

        .add-link-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
        }

        .add-link-form h4 {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .input-field {
            background: var(--bg-primary);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent-color);
        }

        .add-btn {
            background: var(--accent-color);
            color: #0d0f18;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .add-btn:hover { opacity: 0.9; }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 12px;
        }

        .setting-link-item a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 260px;
        }

        .setting-link-item a:hover { text-decoration: underline; }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .delete-btn:hover { background: rgba(239, 68, 68, 0.15); }

        .empty-msg {
            color: var(--text-sub);
            font-size: 0.85rem;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="liquid-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div id="diagonal-wipe" class="diagonal-wipe"></div>

    <div class="top-bar">
        <button id="open-settings" class="icon-btn">⚙️ Einstellungen</button>
    </div>

    <div class="page-content">
        
        <div class="glass-container">
            <div class="clock" id="clock">00:00</div>
            <div class="date" id="date">Lade Datum...</div>

            <form class="search-wrapper" id="searchForm" action="https://www.google.com/search" method="GET">
                <select class="engine-select" id="engineSelect" onchange="changeSearchEngine()">
                    <option value="google">Google</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                    <option value="bing">Bing</option>
                </select>
                <input type="text" name="q" id="searchInput" class="search-input" placeholder="Auf Google suchen..." required autofocus autocomplete="off">
                <button type="submit" class="search-btn">Suchen</button>
            </form>

            <div class="shortcuts" id="main-shortcuts-container"></div>

            <div class="todo-section">
                <div class="todo-input-group">
                    <input type="text" id="todoInput" class="search-input" placeholder="Neue Aufgabe / Notiz..." style="padding: 10px 16px; font-size: 0.9rem;">
                    <button class="todo-add-btn" onclick="addTodo()">+</button>
                </div>
                <ul class="todo-list" id="todoList"></ul>
            </div>

            <div class="scroll-hint">↓ Scrollen für Suchmaschinen ↓</div>
        </div>

        <section class="engine-showcase" id="engine-showcase">
            <h2 class="engine-heading">Suchmaschinen</h2>

            <div class="engine-track">
                <div class="engine-logo google">
                    <img src="https://images.icon-icons.com/2642/PNG/512/google_logo_g_logo_icon_159348.png" alt="Google Logo">
                </div>

                <div class="engine-logo bing">
                    <img src="https://better-internet-for-kids.europa.eu/sites/default/files/styles/1_1_very_large_lt/public/2024-08/Bing.png.webp?itok=pv7Ye2Rz" alt="Bing Logo">
                </div>

                <div class="engine-logo duckduckgo">
                    <img src="https://upload.wikimedia.org/wikipedia/en/9/90/The_DuckDuckGo_Duck.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="DuckDuckGo Logo">
                </div>
            </div>
        </section>

    </div>

    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-card">
            
            <div class="modal-header">
                <h2>Einstellungen</h2>
                <button id="close-settings" class="close-btn">&times;</button>
            </div>

            <div class="modal-body">
                
                <nav class="settings-nav">
                    <button class="nav-btn active" data-tab="tab-appearance">Erscheinungsbild</button>
                    <button class="nav-btn" data-tab="tab-display">Anzeige & Text</button>
                    <button class="nav-btn" data-tab="tab-behavior">Verhalten</button>
                    <button class="nav-btn" data-tab="tab-links">Links verwalten</button>
                </nav>

                <div class="settings-content">
                    
                    <div id="tab-appearance" class="tab-pane active">
                        <div class="setting-item">
                            <div class="setting-label">
                                <span>Modus</span>
                                <small>Sonne / Mond Drehanimation</small>
                            </div>
                            
                            <button id="theme-switch" class="theme-switch-btn" aria-label="Modus wechseln">
                                <div class="icon-wrapper">
                                    <svg class="icon-sun" viewBox="0 0 24 24">
                                        <circle cx="12" cy="12" r="5"></circle>
                                        <line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                                        <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                                        <line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                                        <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                                    </svg>
                                    <svg class="icon-moon" viewBox="0 0 24 24">
                                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                                    </svg>
                                </div>
                            </button>
                        </div>

                        <div class="setting-item">
                            <div class="setting-label">
                                <span>Akzentfarbe</span>
                                <small>Farbe für Buttons & Akzente</small>
                            </div>
                            <div class="color-options">
                                <button class="color-btn active" data-color="#00f2fe" style="background: #00f2fe;"></button>
                                <button class="color-btn" data-color="#10b981" style="background: #10b981;"></button>
                                <button class="color-btn" data-color="#8b5cf6" style="background: #8b5cf6;"></button>
                                <button class="color-btn" data-color="#ff758c" style="background: #ff758c;"></button>
                            </div>
                        </div>
                    </div>

                    <div id="tab-display" class="tab-pane">
                        <div class="setting-item">
                            <div class="setting-label">
                                <span>Schriftgröße</span>
                                <small>Anpassung der Textgröße</small>
                            </div>
                            <select id="size-select" class="custom-select">
                                <option value="14px">Klein</option>
                                <option value="16px" selected>Normal</option>
                                <option value="18px">Groß</option>
                            </select>
                        </div>
                    </div>

                    <div id="tab-behavior" class="tab-pane">
                        <div class="setting-item">
                            <div class="setting-label">
                                <span>Animationen</span>
                                <small>Bewegungseffekte aktivieren</small>
                            </div>
                            <label class="switch">
                                <input type="checkbox" id="animations-toggle" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>

                    <div id="tab-links" class="tab-pane">
                        <form id="add-link-form" class="add-link-form">
                            <h4>Neuen Link hinzufügen</h4>
                            <input type="text" id="link-name" class="input-field" placeholder="Name (z.B. YouTube)" required>
                            <input type="url" id="link-url" class="input-field" placeholder="URL (z.B. https://youtube.com)" required>
                            <button type="submit" class="add-btn">+ Link hinzufügen</button>
                        </form>

                        <div id="link-list" class="link-list"></div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Clock & Date
            function updateClock() {
                const now = new Date();
                document.getElementById('clock').innerText = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                document.getElementById('date').innerText = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
            }
            setInterval(updateClock, 1000);
            updateClock();

            // Search Engine Switcher
            window.changeSearchEngine = function() {
                const engine = document.getElementById('engineSelect').value;
                const form = document.getElementById('searchForm');
                const input = document.getElementById('searchInput');

                if (engine === 'google') {
                    form.action = 'https://www.google.com/search';
                    input.placeholder = 'Auf Google suchen...';
                    input.name = 'q';
                } else if (engine === 'duckduckgo') {
                    form.action = 'https://duckduckgo.com/';
                    input.placeholder = 'Auf DuckDuckGo suchen...';
                    input.name = 'q';
                } else if (engine === 'bing') {
                    form.action = 'https://www.bing.com/search';
                    input.placeholder = 'Auf Bing suchen...';
                    input.name = 'q';
                }
            };

            const searchForm = document.getElementById('searchForm');
            searchForm.addEventListener('submit', (event) => {
                const input = document.getElementById('searchInput');
                if (!input.value.trim()) {
                    return;
                }

                event.preventDefault();
                const wipeOverlay = document.getElementById('diagonal-wipe');

                if (!document.body.classList.contains('no-animations')) {
                    wipeOverlay.classList.remove('animating');
                    void wipeOverlay.offsetWidth;
                    wipeOverlay.classList.add('animating');
                }

                setTimeout(() => {
                    searchForm.submit();
                }, 500);
            });

            // IntersectionObserver für den Scroll-Effekt der Suchmaschinen-Logos
            const revealElements = document.querySelectorAll('.engine-logo');

            const observerOptions = {
                root: null,
                threshold: 0.2,
                rootMargin: '0px 0px -10% 0px'
            };

            const revealObserver = new IntersectionObserver((entries) => {
                entries.forEach((entry, index) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => {
                            entry.target.classList.add('visible');
                        }, index * 160);
                    }
                });
            }, observerOptions);

            revealElements.forEach(el => revealObserver.observe(el));

            // Modal & Navigation
            const modal = document.getElementById("settings-modal");
            const openBtn = document.getElementById("open-settings");
            const closeBtn = document.getElementById("close-settings");
            const navBtns = document.querySelectorAll(".nav-btn");
            const tabPanes = document.querySelectorAll(".tab-pane");

            const themeSwitchBtn = document.getElementById("theme-switch");
            const wipeOverlay = document.getElementById("diagonal-wipe");

            const colorBtns = document.querySelectorAll(".color-btn");
            const sizeSelect = document.getElementById("size-select");
            const animToggle = document.getElementById("animations-toggle");

            // Dynamic Links
            const addLinkForm = document.getElementById("add-link-form");
            const linkNameInput = document.getElementById("link-name");
            const linkUrlInput = document.getElementById("link-url");
            const linkListContainer = document.getElementById("link-list");
            const mainShortcutsContainer = document.getElementById("main-shortcuts-container");

            let links = [
                { id: "1", name: "YouTube", url: "https://www.youtube.com" },
                { id: "2", name: "Wikipedia", url: "https://www.wikipedia.org" },
                { id: "3", name: "GitHub", url: "https://github.com" },
                { id: "4", name: "Reddit", url: "https://www.reddit.com" }
            ];

            navBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    navBtns.forEach(b => b.classList.remove("active"));
                    tabPanes.forEach(p => p.classList.remove("active"));

                    btn.classList.add("active");
                    const targetTab = btn.getAttribute("data-tab");
                    document.getElementById(targetTab).classList.add("active");
                });
            });

            function renderLinks() {
                linkListContainer.innerHTML = "";
                mainShortcutsContainer.innerHTML = "";

                if (links.length === 0) {
                    linkListContainer.innerHTML = `<div class="empty-msg">Keine Links vorhanden.</div>`;
                    return;
                }

                links.forEach(link => {
                    const shortcut = document.createElement("a");
                    shortcut.href = link.url;
                    shortcut.className = "shortcut-card";
                    shortcut.innerText = link.name;
                    mainShortcutsContainer.appendChild(shortcut);

                    const item = document.createElement("div");
                    item.className = "setting-link-item";
                    item.innerHTML = `
                        <a href="${link.url}" target="_blank" rel="noopener noreferrer">${link.name}</a>
                        <button class="delete-btn" data-id="${link.id}" title="Link entfernen">🗑️</button>
                    `;
                    linkListContainer.appendChild(item);
                });

                document.querySelectorAll(".delete-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        const idToDelete = e.target.getAttribute("data-id");
                        links = links.filter(l => l.id !== idToDelete);
                        localStorage.setItem("settings_links", JSON.stringify(links));
                        renderLinks();
                    });
                });
            }

            addLinkForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const name = linkNameInput.value.trim();
                const url = linkUrlInput.value.trim();

                if (name && url) {
                    const newLink = {
                        id: Date.now().toString(),
                        name: name,
                        url: url.startsWith("http") ? url : "https://" + url
                    };

                    links.push(newLink);
                    localStorage.setItem("settings_links", JSON.stringify(links));
                    renderLinks();

                    linkNameInput.value = "";
                    linkUrlInput.value = "";
                }
            });

            // To-Do Logic
            let todos = JSON.parse(localStorage.getItem('myTodos')) || [];

            function renderTodos() {
                const list = document.getElementById('todoList');
                list.innerHTML = '';
                todos.forEach((todo, index) => {
                    const li = document.createElement('li');
                    li.className = 'todo-item';
                    li.innerHTML = `<span>${todo}</span><button onclick="removeTodo(${index})">✕</button>`;
                    list.appendChild(li);
                });
            }

            window.addTodo = function() {
                const input = document.getElementById('todoInput');
                if (input.value.trim() !== '') {
                    todos.push(input.value.trim());
                    localStorage.setItem('myTodos', JSON.stringify(todos));
                    input.value = '';
                    renderTodos();
                }
            };

            window.removeTodo = function(index) {
                todos.splice(index, 1);
                localStorage.setItem('myTodos', JSON.stringify(todos));
                renderTodos();
            };

            renderTodos();

            // Load Settings
            function loadSettings() {
                const savedTheme = localStorage.getItem("settings_theme") || "dark";
                document.body.setAttribute("data-theme", savedTheme);

                const savedColor = localStorage.getItem("settings_color") || "#00f2fe";
                document.documentElement.style.setProperty("--accent-color", savedColor);
                document.documentElement.style.setProperty("--accent-glow", savedColor + '66');
                colorBtns.forEach(btn => {
                    btn.classList.toggle("active", btn.getAttribute("data-color") === savedColor);
                });

                const savedSize = localStorage.getItem("settings_size") || "16px";
                document.documentElement.style.setProperty("--font-size-base", savedSize);
                sizeSelect.value = savedSize;

                const savedAnim = localStorage.getItem("settings_animations");
                const animEnabled = savedAnim !== null ? JSON.parse(savedAnim) : true;
                animToggle.checked = animEnabled;
                document.body.classList.toggle("no-animations", !animEnabled);

                const savedLinks = localStorage.getItem("settings_links");
                if (savedLinks) {
                    links = JSON.parse(savedLinks);
                }
                renderLinks();
            }

            loadSettings();

            // Modal Handlers
            openBtn.addEventListener("click", () => modal.classList.remove("hidden"));
            closeBtn.addEventListener("click", () => modal.classList.add("hidden"));
            modal.addEventListener("click", (e) => {
                if (e.target === modal) modal.classList.add("hidden");
            });

            // Theme Switcher
            themeSwitchBtn.addEventListener("click", () => {
                const currentTheme = document.body.getAttribute("data-theme");
                const newTheme = currentTheme === "dark" ? "light" : "dark";

                if (!document.body.classList.contains("no-animations")) {
                    wipeOverlay.classList.remove("animating");
                    void wipeOverlay.offsetWidth;
                    wipeOverlay.classList.add("animating");

                    setTimeout(() => {
                        document.body.setAttribute("data-theme", newTheme);
                        localStorage.setItem("settings_theme", newTheme);
                    }, 350);
                } else {
                    document.body.setAttribute("data-theme", newTheme);
                    localStorage.setItem("settings_theme", newTheme);
                }
            });

            // Color Selection
            colorBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    colorBtns.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    const newColor = btn.getAttribute("data-color");
                    document.documentElement.style.setProperty("--accent-color", newColor);
                    document.documentElement.style.setProperty("--accent-glow", newColor + '66');
                    localStorage.setItem("settings_color", newColor);
                });
            });

            // Size Selector
            sizeSelect.addEventListener("change", (e) => {
                const newSize = e.target.value;
                document.documentElement.style.setProperty("--font-size-base", newSize);
                localStorage.setItem("settings_size", newSize);
            });

            // Animations Toggle
            animToggle.addEventListener("change", (e) => {
                const enabled = e.target.checked;
                document.body.classList.toggle("no-animations", !enabled);
                localStorage.setItem("settings_animations", JSON.stringify(enabled));
            });
        });
    </script>
</body>
</html>
