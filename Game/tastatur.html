<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tastatur</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #0a0c10;
            --case-bg: #10141b;
            --key-bg: #1f242c;
            --key-border: #2d333b;
            --key-text: #8b949e;
            --panel-bg: #161b22;
            
            --color-row1: #ff4757;
            --color-row2: #ffa502;
            --color-row3: #2ed573;
            --color-row4: #1e90ff;
        }

        [data-theme="matrix"] {
            --bg-color: #020604;
            --case-bg: #0d140f;
            --key-bg: #142219;
            --key-border: #1f3a2b;
            --key-text: #00ff66;
            --panel-bg: #0a100c;
            --color-row1: #00ff66;
            --color-row2: #00dd55;
            --color-row3: #00bb44;
            --color-row4: #00aa33;
        }

        [data-theme="sunset"] {
            --bg-color: #120e16;
            --case-bg: #1f1525;
            --key-bg: #2d1f36;
            --key-border: #443050;
            --key-text: #ff79c6;
            --panel-bg: #1a1220;
            --color-row1: #ff5555;
            --color-row2: #ff79c6;
            --color-row3: #bd93f9;
            --color-row4: #8be9fd;
        }

        [data-theme="minimal"] {
            --bg-color: #f0f2f5;
            --case-bg: #ffffff;
            --key-bg: #f8f9fa;
            --key-border: #e4e7eb;
            --key-text: #4a5568;
            --panel-bg: #ffffff;
            --color-row1: #3182ce;
            --color-row2: #3182ce;
            --color-row3: #3182ce;
            --color-row4: #3182ce;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--key-text);
            overflow: hidden;
            transition: background 0.3s ease;
        }

        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 12, 16, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s ease;
        }

        .start-btn {
            background: #2ed573;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(46, 213, 115, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .start-btn:hover {
            background: #26af5f;
            transform: scale(1.05);
        }

        .control-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 35px;
            background: var(--panel-bg);
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid var(--key-border);
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-panel label {
            font-size: 13px;
            color: var(--key-text);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            background: var(--key-bg);
            color: var(--key-text);
            border: 1px solid var(--key-border);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            outline: none;
        }

        select:hover { border-color: #5865f2; }

        .import-btn {
            background: #5865f2;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }

        .import-btn:hover {
            background: #4752c4;
        }

        #file-input {
            display: none;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 6px;
            background: var(--key-bg);
            border: 1px solid var(--key-border);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #5865f2;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .keyboard {
            background: var(--case-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 2px solid var(--key-border);
            transition: all 0.3s ease;
        }

        .row {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .row:last-child { margin-bottom: 0; }

        .key {
            background: var(--key-bg);
            border: 1px solid var(--key-border);
            border-radius: 10px;
            color: var(--key-text);
            min-width: 50px;
            height: 50px;
            margin: 0 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 15px;
            transition: transform 0.04s ease, background 0.04s ease, box-shadow 0.04s ease;
            box-shadow: 0 5px 0 rgba(0,0,0,0.4);
            user-select: none;
            will-change: transform, background, box-shadow;
        }

        .row-1 .key { --current-color: var(--color-row1); }
        .row-2 .key { --current-color: var(--color-row2); }
        .row-3 .key { --current-color: var(--color-row3); }
        .row-4 .key { --current-color: var(--color-row4); }

        .key.backspace { min-width: 95px; }
        .key.tab { min-width: 75px; }
        .key.caps { min-width: 85px; }
        .key.enter { min-width: 95px; }
        .key.shift { min-width: 120px; }
        .key.space { min-width: 340px; }
        .key.ctrl, .key.alt { min-width: 65px; }

        .key.active {
            background: var(--current-color);
            color: #fff;
            border-color: var(--current-color);
            box-shadow: 0 0px 0 #000, 0 0 20px var(--current-color);
            transform: translateY(5px);
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <button class="start-btn" onclick="initKeyboard()">⌨️ Tastatur aktivieren</button>
    </div>

    <div class="control-panel">
        <div class="control-group">
            <label for="sound-select">Sound:</label>
            <select id="sound-select">
                <optgroup label="Sounds (DJ Black Spider)">
                    <option value="sound_0">sound-01.wav</option>
                    <option value="sound_1">sound-02.wav</option>
                    <option value="sound_2">sound-03.wav</option>
                    <option value="sound_3">sound-04.wav</option>
                    <option value="sound_4">sound-05.wav</option>
                    <option value="sound_5">sound-06.wav</option>
                    <option value="sound_6">sound-07.wav</option>
                    <option value="sound_7">sound-08.wav</option>
                    <option value="sound_8">sound-09.wav</option>
                    <option value="sound_9">sound-10.wav</option>
                </optgroup>
                <optgroup label="Importierte Sounds" id="imported-slots-group">
                </optgroup>
                <optgroup label="Standard">
                    <option value="clean">Red Switch</option>
                    <option value="blue">Blue Switch</option>
                    <option value="thock">White Switch</option>
                </optgroup>
            </select>
        </div>

        <div class="control-group">
            <button class="import-btn" onclick="document.getElementById('file-input').click()">🎵 Sounds importieren</button>
            <input type="file" id="file-input" accept="audio/wav, audio/mpeg" multiple>
        </div>

        <div class="control-group">
            <label for="volume-control">🔊 Vol:</label>
            <input type="range" id="volume-control" class="volume-slider" min="0" max="1" step="0.05" value="0.5">
        </div>

        <div class="control-group">
            <label for="theme-select">Palette:</label>
            <select id="theme-select">
                <option value="cyberpunk">Bunt</option>
                <option value="matrix">Grün</option>
                <option value="sunset">Lila</option>
                <option value="minimal">Whitemode 🤮</option>
            </select>
        </div>
    </div>

    <div class="keyboard">
        <div class="row row-1">
            <div class="key" id="KeyQ">Q</div>
            <div class="key" id="KeyW">W</div>
            <div class="key" id="KeyE">E</div>
            <div class="key" id="KeyR">R</div>
            <div class="key" id="KeyT">T</div>
            <div class="key" id="KeyY">Z</div>
            <div class="key" id="KeyU">U</div>
            <div class="key" id="KeyI">I</div>
            <div class="key" id="KeyO">O</div>
            <div class="key" id="KeyP">P</div>
            <div class="key backspace" id="Backspace">←</div>
        </div>
        <div class="row row-2">
            <div class="key tab" id="Tab">Tab</div>
            <div class="key" id="KeyA">A</div>
            <div class="key" id="KeyS">S</div>
            <div class="key" id="KeyD">D</div>
            <div class="key" id="KeyF">F</div>
            <div class="key" id="KeyG">G</div>
            <div class="key" id="KeyH">H</div>
            <div class="key" id="KeyJ">J</div>
            <div class="key" id="KeyK">K</div>
            <div class="key" id="KeyL">L</div>
            <div class="key enter" id="Enter">Enter</div>
        </div>
        <div class="row row-3">
            <div class="key shift" id="ShiftLeft">Shift</div>
            <div class="key" id="KeyZ">Y</div>
            <div class="key" id="KeyX">X</div>
            <div class="key" id="KeyC">C</div>
            <div class="key" id="KeyV">V</div>
            <div class="key" id="KeyB">B</div>
            <div class="key" id="KeyN">N</div>
            <div class="key" id="KeyM">M</div>
            <div class="key shift" id="ShiftRight">Shift</div>
        </div>
        <div class="row row-4">
            <div class="key ctrl" id="ControlLeft">Ctrl</div>
            <div class="key alt" id="AltLeft">Alt</div>
            <div class="key space" id="Space"></div>
            <div class="key alt" id="AltRight">Alt</div>
            <div class="key ctrl" id="ControlRight">Ctrl</div>
        </div>
    </div>

    <script>
        const soundSelect = document.getElementById('sound-select');
        const themeSelect = document.getElementById('theme-select');
        const importedSlotsGroup = document.getElementById('imported-slots-group');
        const fileInput = document.getElementById('file-input');
        const volumeControl = document.getElementById('volume-control');

        const audioElements = [
            new Audio("sound-01.wav"), new Audio("sound-02.wav"), new Audio("sound-03.wav"),
            new Audio("sound-04.wav"), new Audio("sound-05.wav"), new Audio("sound-06.wav"),
            new Audio("sound-07.wav"), new Audio("sound-08.wav"), new Audio("sound-09.wav"),
            new Audio("sound-10.wav")
        ];

        const importedAudioUrls = {};
        let importCounter = 0;

        let audioCtx;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function updateAllVolumes() {
            const currentVolume = parseFloat(volumeControl.value);
            audioElements.forEach(audio => {
                audio.volume = currentVolume;
            });
        }

        function initKeyboard() {
            document.getElementById('start-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('start-overlay').style.display = 'none', 300);
            updateAllVolumes();
            audioElements.forEach(audio => audio.load());
        }

        volumeControl.addEventListener('input', updateAllVolumes);
        
        // Verhindert das Verstellen der Lautstärke über Pfeiltasten im Nachhinein
        volumeControl.addEventListener('change', () => volumeControl.blur());

        // NEU: Nimmt den Fokus vom Sound-Auswahlmenü, sobald ein Sound gewählt wurde
        soundSelect.addEventListener('change', () => {
            soundSelect.blur();
        });

        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                const blobUrl = URL.createObjectURL(file);
                const slotId = `import_${importCounter}`;
                
                importedAudioUrls[slotId] = blobUrl;
                importCounter++;

                const option = document.createElement('option');
                option.value = slotId;
                option.textContent = file.name;
                importedSlotsGroup.appendChild(option);

                soundSelect.value = slotId;
            }
            soundSelect.blur(); // Auch nach dem Importieren Fokus entfernen!
        });

        // NEU: Nimmt den Fokus vom Farbmenü, sobald eine Palette gewählt wurde
        themeSelect.addEventListener('change', (e) => {
            const theme = e.target.value;
            if (theme === 'cyberpunk') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', theme);
            themeSelect.blur();
        });

        function playSynthesizerSound(type, startFreq, endFreq, duration) {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            
            const volume = parseFloat(volumeControl.value);
            
            osc.type = type;
            osc.frequency.setValueAtTime(startFreq, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(endFreq, ctx.currentTime + (duration * 0.75));
            
            gainNode.gain.setValueAtTime(volume * 0.4, ctx.currentTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            osc.start();
            osc.stop(ctx.currentTime + duration);
        }

        function playCleanSound() { playSynthesizerSound('sine', 500, 100, 0.04); }
        function playBlueSound() { playSynthesizerSound('triangle', 900, 300, 0.03); }
        function playThockSound() { playSynthesizerSound('sine', 170, 40, 0.07); }

        function triggerSound() {
            const currentSound = soundSelect.value;
            const currentVolume = parseFloat(volumeControl.value);
            
            if (currentSound.startsWith('sound_')) {
                const index = parseInt(currentSound.split('_')[1]);
                const audio = audioElements[index];
                if (audio) {
                    audio.currentTime = 0;
                    audio.volume = currentVolume;
                    audio.play().catch(err => console.log("Fehler bei Sound " + (index+1)));
                }
            } else if (currentSound.startsWith('import_')) {
                const blobUrl = importedAudioUrls[currentSound];
                if (blobUrl) {
                    const playAudio = new Audio(blobUrl);
                    playAudio.volume = currentVolume;
                    playAudio.play().catch(err => console.log("Import-Sound blockiert"));
                }
            } else if (currentSound === 'clean') playCleanSound();
            else if (currentSound === 'blue') playBlueSound();
            else if (currentSound === 'thock') playThockSound();
        }

        window.addEventListener('keydown', (e) => {
            if (["Space", "Tab", "AltLeft", "AltRight"].includes(e.code)) e.preventDefault();
            const keyElement = document.getElementById(e.code);
            if (keyElement && !keyElement.classList.contains('active')) {
                keyElement.classList.add('active'); triggerSound();
            }
        });

        window.addEventListener('keyup', (e) => {
            const keyElement = document.getElementById(e.code);
            if (keyElement) keyElement.classList.remove('active');
        });
    </script>
</body>
</html>
